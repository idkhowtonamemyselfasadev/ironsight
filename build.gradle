plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/ironsight.accesswidener")
    runs {
        client {
            if (project.hasProperty("isServer")) {
                programArgs "--quickPlayMultiplayer", project.property("isServer").toString()
            }
            if (project.hasProperty("isUser")) {
                programArgs "--username", project.property("isUser").toString()
            }
        }
    }
}

processResources {
    def props = [
            version           : project.version,
            minecraft_version : project.minecraft_version,
            loader_version    : project.loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
